[project]
name = "files-organizer"
version = "0.1.0"
description = "Organizes photos and videos into folders based on EXIF metadata and calendar events"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "icalendar>=5.0",
    "python-dateutil>=2.8",
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
google = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.0"]
outlook = ["O365>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
files-organizer = "files_organizer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
