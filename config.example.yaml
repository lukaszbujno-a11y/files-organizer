# Skopiuj do config.yaml i dostosuj do swoich potrzeb.

input_dir: "./data/input"
output_dir: "./data/output"
# Aby domyślnie zapisywać na podłączony dysk zewnętrzny (macOS montuje
# dyski pod /Volumes), ustaw output_dir na ścieżkę na tym dysku, np.:
# output_dir: "/Volumes/NazwaDysku/Zdjecia"
# Jeśli dysk nie jest podłączony, uruchomienie zakończy się czytelnym błędem.
unmatched_dir_name: "Nieprzypisane"
overlap_dir_name: "Niedopasowane"

# copy | move
mode: "copy"

# Margines dopasowania zdjęcia do wydarzenia (godziny)
margin_hours: 2

# Reguły przypisywania zdjęć, sprawdzane w podanej kolejności - wygrywa pierwsza
# pasująca. Zdjęcie, do którego nie pasuje żadna reguła, jest pomijane.
#   calendar - wydarzenie z kalendarza:    2026/07/2026-07-15 Wakacje Chorwacja
#   location - GPS z EXIF poza home_country: 2026/07/2026-07-15 Chorwacja-Split
#              (wymaga `pip install -e ".[location_recognition]"`)
#   date     - sama data, ale tylko gdy z danego dnia do tej reguły dotrze
#              więcej niż date_group_threshold zdjęć: 2026/07/2026-07-15
# Zdjęcia przypisane przez wcześniejsze reguły nie liczą się do progu daty.
rules: ["calendar"]
# rules: ["calendar", "location", "date"]

# Kraj "domowy" dla reguły location - zdjęcia z tego kraju ta reguła pomija.
# Nazwa w języku location_recognition.language (domyślnie polskim, np. "Polska";
# przy language: "en" - "Poland"). Bez ustawienia
# reguła przypisuje każde zdjęcie z rozpoznaną lokalizacją.
# home_country: "Polska"

# Próg reguły date: katalog z samą datą powstaje od date_group_threshold + 1 zdjęć.
date_group_threshold: 5

# Lokalny katalog metadanych (SQLite): data, telefon, GPS, tagi każdego pliku.
# Przycisk "Skanuj" w GUI (albo `files-organizer-catalog scan`) czyta exiftoolem tylko
# nowe i zmienione pliki; "Uruchom" robi taki skan przyrostowy sam przed startem i bierze
# metadane z bazy. Baza to tylko kopia danych z plików - można ją w każdej chwili usunąć.
# catalog:
#   enabled: true
#   path: "~/.cache/files-organizer/catalog.sqlite"

calendar:
  # ics | google | outlook
  type: "ics"
  path: "./data/calendar.ics"
  # type: "google"
  # credentials_file: "~/.config/files-organizer/credentials.json"
  # token_file: "~/.config/files-organizer/token.json"
  # outlook:
  #   client_id: ""
  #   client_secret: ""

# Opcjonalne rozdzielenie na katalog nadrzędny na podstawie
# tagu wydarzenia w kalendarzu i modelu telefonu z EXIF.
# Dla kalendarza Google tag to hashtag w tytule lub opisie wydarzenia,
# np. "#Ania" -> klucz "Ania" poniżej (bez #).
phone_mapping:
  # Ania:
  #   camera_model: "iPhone 15 Pro"
  #   parent_dir: "Ania"

# Rozpoznawanie twarzy w tle (`files-organizer-faces --config config.yaml`).
# Wymaga `pip install -e ".[face_recognition]"`. Przetwarzanie odbywa się
# wyłącznie lokalnie - żadne zdjęcia ani dane z nich nie są wysyłane poza
# ten komputer (pierwsze uruchomienie insightface pobiera jednorazowo z sieci
# tylko wagi modelu, nie dane użytkownika).
# face_recognition:
#   type: "insightface"
#   # Katalog ze zdjęciami referencyjnymi: known_faces/<Osoba>/*.jpg
#   known_faces_dir: "./known_faces"
#   # Opcjonalnie: gdzie trzymać cache embeddingów (domyślnie known_faces_dir/cache/embeddings.pkl)
#   cache_path: "./known_faces/cache/embeddings.pkl"
#   # Próg odległości kosinusowej - im niższy, tym bardziej rygorystyczne dopasowanie
#   threshold: 0.4

# Rozpoznawanie lokalizacji w tle (`files-organizer-locations --config config.yaml`).
# Działa wyłącznie na podstawie współrzędnych GPS zapisanych w EXIF zdjęcia.
# Zdjęcia bez GPS są pomijane. Dwa backendy:
#
#   reverse_geocoder - offline (lokalna baza miast GeoNames, nic nie jest wysyłane),
#                      wymaga `pip install -e ".[location_recognition]"`. Kraje po polsku,
#                      ale miasta angielskie, bez polskich znaków ("Krakow", "Vienna").
#   nominatim        - online (OpenStreetMap). Miasta i kraje po polsku, z polskimi znakami
#                      ("Kraków", "Wiedeń", "Lwów"). Bez dodatkowych zależności.
#                      UWAGA: współrzędne GPS (nie same zdjęcia) są wysyłane do
#                      nominatim.openstreetmap.org. Limit serwera to 1 zapytanie/s, więc
#                      wyniki są cache'owane na dysku - ponowne uruchomienie na tych
#                      samych zdjęciach nic już nie wysyła. Bez internetu nazwy brane są
#                      z cache; gdy jej tam nie ma, cały proces jest przerywany (przed
#                      kopiowaniem/przenoszeniem, więc żaden plik nie zostaje ruszony).
# location_recognition:
#   type: "nominatim"            # albo "reverse_geocoder"
#   # Język nazw w tagach Location:/Country: i katalogach reguły location (domyślnie "pl").
#   language: "pl"
#   # Tylko nominatim: plik cache (domyślnie ~/.cache/files-organizer/nominatim.json)
#   # cache_path: "~/.cache/files-organizer/nominatim.json"
#   # Tylko nominatim: promień cache w km - zdjęcie w tej odległości od miejsca już
#   # sprawdzonego dostaje jego nazwę bez zapytania do API (większy = mniej zapytań, ale
#   # ryzyko nazwy sąsiedniej miejscowości)
#   # cache_radius_km: 2
